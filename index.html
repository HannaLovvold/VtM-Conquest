<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0605" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <title>VtM Conquest</title>

    <!-- Primary Meta -->
    <meta name="description" content="VtM Conquest — a gothic World of Darkness strategy sandbox, built on the open source Open Historia engine." />

    <!-- Open graph — the share card for /play/ (and the local install). Deliberately
         NO canonical and NO structured data here: this file is the game entry, which
         the website serves at /play/, so it must not claim to be the homepage. The
         homepage's own meta + JSON-LD live in site/index.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VtM Conquest" />
    <meta property="og:title" content="VtM Conquest" />
    <meta property="og:description" content="VtM Conquest — a gothic World of Darkness strategy sandbox, built on the open source Open Historia engine." />
    <meta property="og:image" content="/loading_screen_vtm.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VtM Conquest" />
    <meta name="twitter:description" content="VtM Conquest — a gothic World of Darkness strategy sandbox, built on the open source Open Historia engine." />
    <meta name="twitter:image" content="/loading_screen_vtm.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
